# Autopilot dispatcher — the scheduler heartbeat. Starts ready tasks within the
# concurrency limit, plans approved contracts, completes finished contracts,
# and keeps open Autopilot PRs mergeable.
name: Autopilot Dispatch

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  issues:
    types: [closed]
  pull_request_target:
    types: [closed]

concurrency:
  group: autopilot-dispatch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.AUTOPILOT_APP_PRIVATE_KEY }}
      # Always the default branch: never execute PR code here.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Dispatch
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/autopilot/cli.mjs dispatch
